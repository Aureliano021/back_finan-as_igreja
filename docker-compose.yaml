    ipc: host
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_NAME=bi_learning
      - DB_USER=postgres
      - DB_PASSWORD=Tumiritinga2226
      - SECRET_KEY=g85uEUYMECeoeRa4M/uJj9/BdKr521N0SdBuuZ9cqgQ=
      - ALGORITHM=HS256
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend/igreja-financas-fe
      dockerfile: Dockerfile
