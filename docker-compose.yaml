    image: postgres:16-alpine
    container_name: igreja_postgres
    restart: always
    network_mode: host
    ipc: host
    environment:
      POSTGRES_DB: bi_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tumiritinga2226
    volumes:
      - ./postgress/data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
